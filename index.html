:23px;box-shadow:0 25px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.close{background:#f1f3f4;border-radius:8px;padding:7px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:12px}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}.mini{font-size:10px;color:var(--muted)}.metric{font-weight:800}.footer-note{text-align:center;color:#8a969d;font-size:10px;margin:24px 0 0}.hidden{display:none!important}

function issueTable(list=state.issues){return `<div class="table-wrap"><table><thead><tr><th>Referencia</th><th>Incidencia</th><th>Obra</th><th>Prioridad</th><th>Responsable</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td>${i.id}</td><td><div class="table-title">${i.title}</div></td><td>${i.site}</td><td>${badge(i.priority)}</td><td>${i.owner}</td><td>${i.date}</td><td>${badge(i.status)}</td><td><button class="btn btn-light" onclick="resolveIssue('${i.id}')">Actualizar</button></td></tr>`).join('')}</tbody></table></div>`}
function resolveIssue(id){let i=state.issues.find(x=>x.id===id);i.status=i.status==='En curso'?'Pendiente':'En curso';toast('Estado actualizado en la demo');render()}
function documentacion(){return `<div class="pagehead"><div><div class="eyebrow">Repositorio operativo</div><h1>Documentación</h1><p class="sub">Documentos vinculados a obras, responsables y estado de revisión.</p></div><button class="btn btn-primary" onclick="openModal('doc')">＋ Registrar documento</button></div><div class="notice">Esta vista ilustra un registro documental. No almacena ni adjunta archivos reales.</div><div class="card"><div class="card-head"><div><h2>Documentos de muestra</h2><p>Vigencias y tareas pendientes</p></div></div><div class="table-wrap"><table><thead><tr><th>Documento</th><th>Obra</th><th>Tipo</th><th>Responsable</th><th>Actualización</th><th>Estado</th></tr></thead><tbody>${state.docs.map(d=>`<tr><td><div class="table-title">${d.name}</div></td><td>${d.site}</td><td>${d.type}</td><td>${d.owner}</td><td>${d.date}</td><td>${badge(d.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function equipo(){return `<div class="pagehead"><div><div class="eyebrow">Responsabilidad y actividad</div><h1>Equipo y actividad</h1><p class="sub">Seguimiento de partes, incidencias y carga de coordinación de jefes de obra.</p></div></div><div class="notice">El seguimiento está planteado sobre tareas y resultados profesionales, no sobre vigilancia continua ni geolocalización indiscriminada.</div><div class="grid kpis">${kpi('Jefes de obra',5,'Responsables en la muestra','♙')}${kpi('Partes registrados',state.reports.length,'Registros de ejemplo','▤')}${kpi('Incidencias asignadas',state.issues.length,'Con responsable','⚑')}${kpi('Partes por validar',state.reports.filter(r=>r.status==='Pendiente').length,'Revisión de dirección','◷','warning')}</div><div class="card"><div class="card-head"><div><h2>Actividad por responsable</h2><p>Obras asignadas, partes e incidencias pendientes</p></div></div><div class="table-wrap"><table><thead><tr><th>Responsable</th><th>Obra principal</th><th>Partes</th><th>Incidencias</th><th>Estado operativo</th><th></th></tr></thead><tbody>${['Javier Soler','Marta Ferrer','David Pérez','Carlos Navarro','Lucía Martínez'].map(n=>{let r=state.reports.filter(x=>x.manager===n).length,i=state.issues.filter(x=>x.owner===n).length,p=state.projects.find(x=>x.manager===n);return `<tr><td><div class="person"><div class="person-avatar">${n.split(' ').map(x=>x[0]).join('')}</div><div><div class="person-name">${n}</div><div class="table-sub">Jefatura de obra</div></div></div></td><td>${p?p.id:'—'}</td><td>${r}</td><td>${i}</td><td>${badge(i>1?'Revisar':'En seguimiento')}</td><td><button class="btn btn-light" onclick="toast('Detalle ilustrativo de '+${JSON.stringify(n)})">Ver actividad</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function render(){document.getElementById('crumb').textContent=navNames[state.page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));let f={dashboard,obras,empleados,partes,costes,incidencias,documentacion,equipo}[state.page];document.getElementById('content').innerHTML=f();document.getElementById('sidebar').classList.remove('open')}
function go(page){state.page=page;render();window.scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
function filterProjects(){let q=(document.getElementById('projectSearch')?.value||'').toLowerCase(),s=document.getElementById('projectStatus')?.value||'';document.getElementById('projectTable').innerHTML=projectTable(state.projects.filter(p=>(p.name+' '+p.client+' '+p.id).toLowerCase().includes(q)&&(!s||p.status===s)))}
function filterEmployees(){let q=(document.getElementById('employeeSearch')?.value||'').toLowerCase(),s=document.getElementById('employeeStatus')?.value||'';document.getElementById('employeeTable').innerHTML=employeeTable(state.employees.filter(e=>(e.name+' '+e.role+' '+siteName(e.site)).toLowerCase().includes(q)&&(!s||e.status===s)))}
function filterReports(){let s=document.getElementById('reportFilter')?.value||'';document.getElementById('reportTable').innerHTML=reportTable(state.reports.filter(r=>!s||r.status===s))}
function filterIssues(){let q=(document.getElementById('issueSearch')?.value||'').toLowerCase(),s=document.getElementById('issueStatus')?.value||'';document.getElementById('issueTable').innerHTML=issueTable(state.issues.filter(i=>(i.title+' '+i.owner+' '+i.site).toLowerCase().includes(q)&&(!s||i.status===s)))}
function exportData(){let rows=[['ID','Nombre','Puesto','Obra','Estado','Entrada','Horas'],...state.employees.map(e=>[e.id,e.name,e.role,e.site,e.status,e.in,e.hours])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='demo-adolfo-perez-datos-ficticios.csv';a.click();URL.revokeObjectURL(url);toast('Exportación CSV generada con datos de demostración')}
let modalType='';
function openModal(type){modalType=type;document.getElementById('saveModal').classList.remove('hidden');let titles={project:'Registrar nueva obra',employee:'Añadir empleado',report:'Nuevo parte de obra',issue:'Registrar incidencia',doc:'Registrar documento'};document.getElementById('modalTitle').textContent=titles[type]||'Nueva entrada';let projectOpts=state.projects.map(p=>`<option value="${p.id}">${p.id} · ${p.name}</option>`).join('');let managerOpts=state.projects.map(p=>`<option>${p.manager}</option>`).join('');let forms={
project:`<div class="field-grid"><div class="field"><label>Nombre de la obra *</label><input id="f_name" required placeholder="Nombre del proyecto"></div><div class="field"><label>Cliente</label><input id="f_client" placeholder="Cliente"></div><div class="field"><label>Ubicación</label><input id="f_location" placeholder="Municipio"></div><div class="field"><label>Presupuesto (€)</label><input id="f_budget" type="number" min="0" value="0"></div><div class="field"><label>Jefe de obra</label><input id="f_manager" placeholder="Responsable"></div><div class="field"><label>Fecha prevista de fin</label><input id="f_end" type="date"></div></div>`,
employee:`<div class="field-grid"><div class="field"><label>Nombre completo *</label><input id="f_name" required placeholder="Nombre y apellidos"></div><div class="field"><label>Puesto</label><select id="f_role"><option>Operario</option><option>Oficial de 1.ª</option><option>Oficial de 2.ª</option><option>Encargado</option><option>Jefe de obra</option><option>Administración</option></select></div><div class="field"><label>Obra asignada</label><select id="f_site">${projectOpts}</select></div><div class="field"><label>Teléfono (demo)</label><input id="f_phone" placeholder="No usar datos reales"></div></div>`,
report:`<div class="field-grid"><div class="field"><label>Obra *</label><select id="f_site">${projectOpts}</select></div><div class="field"><label>Responsable</label><select id="f_manager">${managerOpts}</select></div><div class="field"><label>Actividad / título *</label><input id="f_title" required placeholder="Ej. avance de instalaciones"></div><div class="field"><label>Estado</label><select id="f_status"><option>Pendiente</option><option>Validado</option><option>Incidencia</option></select></div><div class="field" style="grid-column:1/-1"><label>Detalle del parte *</label><textarea id="f_text" placeholder="Avance, recursos, bloqueos, siguientes pasos…"></textarea></div></div>`,
issue:`<div class="field-grid"><div class="field"><label>Obra</label><select id="f_site">${projectOpts}</select></div><div class="field"><label>Prioridad</label><select id="f_priority"><option>Alta</option><option>Media</option><option>Baja</option></select></div><div class="field" style="grid-column:1/-1"><label>Descripción *</label><input id="f_title" required placeholder="Describe la incidencia"></div><div class="field"><label>Responsable</label><select id="f_owner">${managerOpts}</select></div><div class="field"><label>Estado</label><select id="f_status"><option>Abierta</option><option>En curso</option><option>Pendiente</option></select></div></div>`,
doc:`<div class="field-grid"><div class="field"><label>Nombre del documento *</label><input id="f_name" required placeholder="Nombre del documento"></div><div class="field"><label>Obra</label><select id="f_site">${projectOpts}</select></div><div class="field"><label>Tipo</label><select id="f_type"><option>Seguridad</option><option>Prevención</option><option>Certificación</option><option>Calidad</option><option>Cierre</option><option>Otro</option></select></div><div class="field"><label>Responsable</label><select id="f_owner">${managerOpts}</select></div><div class="field"><label>Estado</label><select id="f_status"><option>Vigente</option><option>Pendiente</option><option>Por revisar</option></select></div></div>`
};document.getElementById('modalBody').innerHTML=forms[type]||'<p>Formulario de demostración.</p>';document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('quickAdd').onclick=()=>openModal(state.page==='obras'?'project':state.page==='empleados'?'employee':state.page==='incidencias'?'issue':state.page==='documentacion'?'doc':'report');
document.getElementById('saveModal').onclick=()=>{let v=id=>document.getElementById(id)?.value||'';let required=modalType==='project'||modalType==='employee'||modalType==='doc'?v('f_name'):modalType==='report'?v('f_title')&&v('f_text'):v('f_title');if(!required){toast('Completa los campos obligatorios');return}let d=new Date().toLocaleDateString('es-ES');if(modalType==='project'){state.projects.unshift({id:'OB-'+String(27+state.projects.length).padStart(3,'0'),name:v('f_name'),client:v('f_client'),location:v('f_location'),manager:v('f_manager')||'Por asignar',budget:Number(v('f_budget'))||0,cost:0,progress:0,status:'En ejecución',start:d,end:v('f_end')||'Por definir',workers:0,alerts:0})}if(modalType==='employee'){state.employees.unshift({id:'EMP-'+String(1+state.employees.length).padStart(3,'0'),name:v('f_name'),role:v('f_role'),site:v('f_site'),status:'No fichado',in:'—',hours:0,phone:v('f_phone')})}if(modalType==='report'){state.reports.unshift({date:d,site:v('f_site'),manager:v('f_manager'),title:v('f_title'),text:v('f_text'),status:v('f_status')})}if(modalType==='issue'){state.issues.unshift({id:'INC-'+(105+state.issues.length),site:v('f_site'),title:v('f_title'),priority:v('f_priority'),owner:v('f_owner'),date:d,status:v('f_status')})}if(modalType==='doc'){state.docs.unshift({name:v('f_name'),site:v('f_site'),type:v('f_type'),status:v('f_status'),owner:v('f_owner'),date:d})}closeModal();render();toast('Registro añadido a esta demo. Los datos no se guardan al cerrar el archivo.')};
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
render();
</script>
</body>
</html>
